<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>음성 길찾기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#121212;--panel:#1e1e1e;--panel2:#2b2b2b;--line:#3a3a3a;
  --text:#f2f2f2;--muted:#a0a0a0;
  --accent:#ff9f0a;--accent-d:#c77d00;
  --green:#30d158;--blue:#0a84ff;--red:#ff453a;
  --radius:14px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  overscroll-behavior:none}
#map{position:fixed;inset:0;z-index:0;background:#0d0d0d}
.leaflet-container{background:#0d0d0d;font-family:inherit}

/* 상단 검색바 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:8px;align-items:center;
  padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.searchbox{flex:1;display:flex;align-items:center;background:rgba(28,28,30,.94);
  border:1px solid var(--line);border-radius:24px;padding:4px 4px 4px 16px;
  box-shadow:0 2px 14px rgba(0,0,0,.5)}
.searchbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);
  font-size:16px;padding:8px 0}
.searchbox input::placeholder{color:var(--muted)}
.iconbtn{width:40px;height:40px;flex:none;border-radius:50%;border:none;background:var(--panel2);
  color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.micbtn{width:52px;height:52px;flex:none;border-radius:50%;border:none;cursor:pointer;
  background:var(--accent);font-size:24px;color:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 14px rgba(255,159,10,.45)}
.micbtn.listening{animation:pulse 1.1s ease-in-out infinite;background:var(--red)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.setbtn{position:fixed;z-index:20;left:12px;bottom:calc(18px + env(safe-area-inset-bottom))}

/* 나침반 */
.compass{position:fixed;z-index:20;right:12px;top:calc(78px + env(safe-area-inset-top));
  width:68px;height:68px;border-radius:50%;background:rgba(28,28,30,.92);
  border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.5);
  cursor:pointer;overflow:hidden;user-select:none}
.cdial{position:absolute;inset:0;transition:transform .18s linear}
.cdial span{position:absolute;left:50%;top:50%;font-size:11px;font-weight:700;color:var(--muted);
  transform:rotate(var(--a)) translateY(-24px);transform-origin:0 0}
.cdial span.cn{color:var(--red);font-size:13px}
.cneedle{position:absolute;left:50%;top:50%;transform:translate(-50%,-58%);color:var(--accent);
  font-size:16px;text-shadow:0 0 6px rgba(0,0,0,.8)}
.cdeg{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:10px;color:var(--muted)}
.cmode{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:9px;color:var(--accent)}

/* 현재위치 버튼 */
.locbtn{position:fixed;z-index:20;right:12px;bottom:calc(18px + env(safe-area-inset-bottom))}

/* 하단 시트 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s ease;max-height:62vh;overflow-y:auto}
.sheet.open{transform:none}
.sheet h3{font-size:17px;margin-bottom:6px}
.sheet .route-line{font-size:15px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.sheet .route-line b{color:var(--text)}
.sheet .meta{display:flex;gap:14px;font-size:14px;color:var(--muted);margin-bottom:12px}
.sheet .meta b{color:var(--accent);font-size:16px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;background:var(--accent);color:#1a1a1a}
.btn.ghost{background:var(--panel2);color:var(--text);font-weight:500}
.btn.blue{background:var(--blue);color:#fff}
.chips{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:18px;border:1px solid var(--line);background:var(--panel2);
  color:var(--muted);font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1a1a1a;font-weight:700}
.err{color:var(--red);font-size:15px;line-height:1.6}
.hint{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}

/* 길안내 오버레이 */
.guidance{position:fixed;top:0;left:0;right:0;z-index:40;display:none;
  background:rgba(18,18,18,.96);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 14px}
.guidance.on{display:block}
.guidance .gdist{font-size:15px;color:var(--accent);font-weight:700;margin-bottom:2px}
.guidance .gturn{font-size:30px;font-weight:800;line-height:1.25}
.guidance .gdest{font-size:13px;color:var(--muted);margin-top:6px}
.guidance .gstop{margin-top:10px;width:100%;padding:12px;border:none;border-radius:12px;
  background:var(--red);color:#fff;font-size:16px;font-weight:700;cursor:pointer}

/* 설정 모달 */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.6)}
.modal.open{display:flex}
.mbox{background:var(--panel);border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:80vh;overflow-y:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.mbox h2{font-size:18px;margin-bottom:14px}
.msec{margin-bottom:18px}
.msec h4{font-size:14px;color:var(--muted);margin-bottom:8px;font-weight:600}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;cursor:pointer}
.prow.sel{border-color:var(--accent);background:rgba(255,159,10,.08)}
.prow .pname{font-size:15px;font-weight:600}
.prow .pstat{font-size:12px;color:var(--muted);margin-left:auto}
.prow.disabled{opacity:.55}
.place-row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);
  font-size:15px}
.place-row .del{margin-left:auto;background:none;border:none;color:var(--red);font-size:16px;cursor:pointer}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-size:15px;padding:11px 12px;outline:none}
.inrow button{padding:11px 16px;border:none;border-radius:10px;background:var(--accent);
  color:#1a1a1a;font-weight:700;font-size:15px;cursor:pointer}
.mclose{width:100%;padding:13px;border:none;border-radius:12px;background:var(--panel2);
  color:var(--text);font-size:16px;cursor:pointer;margin-top:6px}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  z-index:60;background:rgba(20,20,20,.95);border:1px solid var(--line);color:var(--text);
  font-size:14px;padding:11px 18px;border-radius:24px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 로딩 */
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px;padding:8px 0}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="searchbox">
    <input id="cmdInput" type="text" placeholder="&quot;강남역까지 걸어서&quot; 말하거나 입력" autocomplete="off">
    <button class="iconbtn" id="searchBtn" title="검색">🔍</button>
  </div>
  <button class="micbtn" id="micBtn" title="음성 명령">🎤</button>
</div>

<div class="compass" id="compass" title="나침반 (탭: 북쪽고정/진행방향)">
  <div class="cdial" id="cdial">
    <span class="cn" style="--a:0deg">N</span>
    <span style="--a:90deg">E</span>
    <span style="--a:180deg">S</span>
    <span style="--a:270deg">W</span>
  </div>
  <div class="cneedle">▲</div>
  <div class="cdeg" id="cdeg">--°</div>
  <div class="cmode" id="cmode">북쪽 고정</div>
</div>

<button class="iconbtn locbtn" id="locBtn" title="현재 위치">📍</button>
<button class="iconbtn setbtn" id="setBtn" title="설정">⚙️</button>

<div class="sheet" id="sheet"></div>

<div class="guidance" id="guidance">
  <div class="gdist" id="gDist">--</div>
  <div class="gturn" id="gTurn">--</div>
  <div class="gdest" id="gDest"></div>
  <button class="gstop" id="gStop">길안내 종료</button>
</div>

<div class="modal" id="settingsModal">
  <div class="mbox">
    <h2>설정</h2>
    <div class="msec">
      <h4>지도 선택</h4>
      <div class="prow sel" id="provKakao">
        <div><div class="pname">카카오 지도</div></div>
        <div class="pstat" id="kakaoStat">사용 가능</div>
      </div>
      <div class="prow disabled" id="provNaver">
        <div><div class="pname">네이버 지도</div></div>
        <div class="pstat">준비 중</div>
      </div>
    </div>
    <div class="msec">
      <h4>저장 장소 (우리집 / 회사 등)</h4>
      <div id="placeList"></div>
      <div class="inrow">
        <input id="placeName" placeholder="이름 (예: 우리집)">
        <input id="placeAddr" placeholder="주소 (예: 구일로 4길 65)">
        <button id="placeAdd">추가</button>
      </div>
      <div class="hint">주소를 입력하면 좌표로 변환해 저장합니다. 명령에서 "우리집에서 회사까지 버스로" 처럼 쓸 수 있어요.</div>
    </div>
    <div class="msec">
      <h4>도보 경로 (TMap)</h4>
      <div class="inrow">
        <input id="tmapKey" placeholder="TMap appKey" autocomplete="off">
        <button id="tmapSave">저장</button>
      </div>
      <div class="hint">openapi.sk.com에서 "보행자 경로안내" 상품을 구독한 앱의 appKey를 입력하면 도보 경로를 TMap(한국 도보 데이터)으로 계산합니다. 키가 없거나 연결에 실패하면 공개 서버(OSM)로 계산합니다.</div>
    </div>
    <button class="mclose" id="setClose">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= 설정 ================= */
const KAKAO_JS_KEY = '1259ea885fdd86c4ef6a770b5882ecd7';
const KAKAO_SDK_URL = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY + '&libraries=services&autoload=false';
const LEAFLET_JS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
const SEOUL = { lat: 37.5665, lng: 126.9780 };

const $ = id => document.getElementById(id);
const state = {
  adapter: null, kakaoReady: false,
  myLoc: null,            // {lat,lng}
  markers: [],            // adapter-agnostic handles kept by adapter
  lastRoute: null,        // {from,to,mode,points,distance,duration,steps}
  savedPlaces: {},        // name -> {lat,lng,name}
  mapProvider: 'kakao',
};

/* ================= 유틸 ================= */
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
function haversineM(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m) + 'm'; }
function fmtTime(s) {
  const m = Math.round(s / 60);
  if (m < 60) return m + '분';
  return Math.floor(m / 60) + '시간 ' + (m % 60) + '분';
}
function loadScript(src, timeoutMs) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    const to = setTimeout(() => { s.remove(); reject(new Error('timeout')); }, timeoutMs || 10000);
    s.onload = () => { clearTimeout(to); resolve(); };
    s.onerror = () => { clearTimeout(to); s.remove(); reject(new Error('loadfail')); };
    document.head.appendChild(s);
  });
}
function withTimeout(p, ms, label) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label || 'timeout')), ms))]);
}
// 선분 AB에 점 P를 투영 (짧은 구간용 equirectangular 근사)
function projectPointOnSegment(p, a, b) {
  const r = Math.PI / 180, lat0 = (a.lat + b.lat) / 2 * r, kx = 111320 * Math.cos(lat0), ky = 110540;
  const ax = a.lng * kx, ay = a.lat * ky, bx = b.lng * kx, by = b.lat * ky, px = p.lng * kx, py = p.lat * ky;
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return { dist: Math.hypot(px - cx, py - cy), along: Math.hypot(t * dx, t * dy), t };
}

/* ================= 지도 어댑터 (provider 추상화) =================
   공통 인터페이스: setCenter, addMarker, clearMarkers, drawRoute, clearRoute,
   setUserLocation, fitPoints, searchKeyword, searchAddress                     */
class KakaoAdapter {
  async init() {
    await withTimeout(new Promise((resolve, reject) => {
      try {
        if (!window.kakao) { reject(new Error('no kakao')); return; }
        kakao.maps.load(() => {
          try {
            this.map = new kakao.maps.Map($('map'), {
              center: new kakao.maps.LatLng(SEOUL.lat, SEOUL.lng), level: 5
            });
            this.places = new kakao.maps.services.Places();
            this.geocoder = new kakao.maps.services.Geocoder();
            this.markers = []; this.polyline = null; this.userMarker = null;
            resolve();
          } catch (e) { reject(e); }
        });
      } catch (e) { reject(e); }
    }), 9000, 'kakao-init-timeout');
    return true;
  }
  setCenter(lat, lng) { this.map.setCenter(new kakao.maps.LatLng(lat, lng)); }
  addMarker(lat, lng, opts) {
    opts = opts || {};
    const m = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: this.map });
    if (opts.label) {
      const iw = new kakao.maps.InfoWindow({ content: '<div style="padding:4px 8px;font-size:12px;color:#111">' + opts.label + '</div>' });
      iw.open(this.map, m); this.markers.push(iw);
    }
    this.markers.push(m); return m;
  }
  clearMarkers() { this.markers.forEach(m => { try { m.setMap ? m.setMap(null) : m.close(); } catch (e) {} }); this.markers = []; }
  drawRoute(points) {
    this.clearRoute();
    const path = points.map(p => new kakao.maps.LatLng(p[0], p[1]));
    this.polyline = new kakao.maps.Polyline({ path, strokeWeight: 6, strokeColor: '#ff9f0a', strokeOpacity: 0.95, strokeStyle: 'solid' });
    this.polyline.setMap(this.map);
    const b = new kakao.maps.LatLngBounds(); path.forEach(p => b.extend(p)); this.map.setBounds(b);
  }
  clearRoute() { if (this.polyline) { this.polyline.setMap(null); this.polyline = null; } }
  setUserLocation(lat, lng) {
    const pos = new kakao.maps.LatLng(lat, lng);
    if (!this.userMarker) {
      this.userMarker = new kakao.maps.Marker({
        position: pos, map: this.map,
        image: new kakao.maps.MarkerImage(
          'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="9" fill="#0a84ff" fill-opacity="0.9" stroke="#fff" stroke-width="3"/></svg>'),
          new kakao.maps.Size(26, 26))
      });
    } else this.userMarker.setPosition(pos);
  }
  searchKeyword(q, near) {
    return new Promise(resolve => {
      const o = { size: 5 };
      if (near) { o.x = near.lng; o.y = near.lat; o.radius = 20000; }
      this.places.keywordSearch(q, (data, status) => {
        if (status === kakao.maps.services.Status.OK && data && data.length) {
          const d = data[0];
          resolve({ lat: +d.y, lng: +d.x, name: d.place_name || q, category: d.category_name || '' });
        } else resolve(null);
      }, o);
    });
  }
  searchAddress(q) {
    return new Promise(resolve => {
      this.geocoder.addressSearch(q, (data, status) => {
        if (status === kakao.maps.services.Status.OK && data && data.length) {
          const d = data[0];
          const name = (d.road_address && d.road_address.address_name) || d.address_name || q;
          resolve({ lat: +d.y, lng: +d.x, name });
        } else resolve(null);
      });
    });
  }
  searchKeywordList(q, near, maxN) {
    return new Promise(resolve => {
      const o = { size: Math.min(maxN || 5, 15) };
      if (near) { o.x = near.lng; o.y = near.lat; o.radius = 3000; }
      this.places.keywordSearch(q, (data, status) => {
        if (status === kakao.maps.services.Status.OK && data) {
          resolve(data.map(d => ({ lat: +d.y, lng: +d.x, name: d.place_name || q })));
        } else resolve([]);
      }, o);
    });
  }
}

class LeafletAdapter {
  async init() {
    await loadScript(LEAFLET_JS, 12000);
    if (!window.L) throw new Error('no leaflet');
    this.map = L.map('map', { zoomControl: false }).setView([SEOUL.lat, SEOUL.lng], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20, attribution: '© OpenStreetMap contributors © CARTO'
    }).addTo(this.map);
    this.layer = L.layerGroup().addTo(this.map);
    this.routeLayer = null; this.userMarker = null;
    setTimeout(() => { try { this.map.invalidateSize(); } catch (e) {} }, 300);
    return true;
  }
  setCenter(lat, lng) { this.map.setView([lat, lng], 15); }
  addMarker(lat, lng, opts) {
    opts = opts || {};
    const m = L.marker([lat, lng]).addTo(this.layer);
    if (opts.label) m.bindPopup(opts.label).openPopup();
    return m;
  }
  clearMarkers() { this.layer.clearLayers(); }
  drawRoute(points) {
    this.clearRoute();
    this.routeLayer = L.polyline(points, { color: '#ff9f0a', weight: 6, opacity: 0.95 }).addTo(this.map);
    this.map.fitBounds(this.routeLayer.getBounds(), { padding: [40, 40] });
  }
  clearRoute() { if (this.routeLayer) { this.map.removeLayer(this.routeLayer); this.routeLayer = null; } }
  setUserLocation(lat, lng) {
    if (!this.userMarker) {
      this.userMarker = L.circleMarker([lat, lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#0a84ff', fillOpacity: 1 }).addTo(this.map);
    } else this.userMarker.setLatLng([lat, lng]);
  }
  // Leaflet 폴백에서는 카카오 검색 불가 → null 반환, 상위에서 Nominatim 사용
  searchKeyword() { return Promise.resolve(null); }
  searchAddress() { return Promise.resolve(null); }
  searchKeywordList() { return Promise.resolve([]); }
}

/* ================= 지오코딩 ================= */
async function nominatimSearch(q, near) {
  try {
    let url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q=' + encodeURIComponent(q);
    if (near) url += '&viewbox=' + (near.lng - 0.2) + ',' + (near.lat + 0.2) + ',' + (near.lng + 0.2) + ',' + (near.lat - 0.2) + '&bounded=0';
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const j = await r.json();
    if (j && j.length) return { lat: +j[0].lat, lng: +j[0].lon, name: j[0].display_name.split(',')[0] || q };
  } catch (e) {}
  return null;
}
async function geocode(query, near) {
  if (!query) return null;
  const q = query.trim();
  if (state.kakaoReady && state.adapter instanceof KakaoAdapter) {
    try {
      const k = await state.adapter.searchKeyword(q, near);
      if (k) return k;
      const a = await state.adapter.searchAddress(q);
      if (a) return a;
    } catch (e) {}
  }
  return await nominatimSearch(q, near);
}

/* 지하철역이면 상대편에서 가장 가까운 출구 좌표로 스냅 */
function isSubwayStation(place) {
  if (!place || !place.name || !/역$/.test(place.name)) return false;
  const cat = place.category || '';
  return cat.includes('지하철') || cat.includes('전철');
}
async function nearestExit(station, ref) {
  try {
    if (!(state.kakaoReady && state.adapter instanceof KakaoAdapter)) return null;
    const list = await state.adapter.searchKeywordList(station.name + ' 출구', { lat: station.lat, lng: station.lng }, 15);
    const exits = (list || []).filter(e => e.name && e.name.includes('출구'));
    if (!exits.length) return null;
    let best = null, bestD = Infinity;
    for (const e of exits) {
      const d = haversineM(ref, e);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  } catch (e) { return null; }
}

/* ================= 저장 장소 ================= */
function loadSavedPlaces() {
  try { state.savedPlaces = JSON.parse(localStorage.getItem('vnv_places') || '{}'); }
  catch (e) { state.savedPlaces = {}; }
}
function saveSavedPlaces() {
  try { localStorage.setItem('vnv_places', JSON.stringify(state.savedPlaces)); } catch (e) {}
}
function resolveAlias(name) {
  if (!name) return null;
  const p = state.savedPlaces[name];
  if (p) return { lat: p.lat, lng: p.lng, name: name };
  return name; // 문자열 그대로 (지오코딩 대상)
}

/* ================= GPS ================= */
function getGPS(timeoutMs) {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve(null); return; }
    let done = false;
    const ok = p => {
      if (done) return; done = true;
      const acc = Math.round(p.coords.accuracy || 9999);
      if (acc > 500) toast('GPS 정확도가 낮아요(±' + acc + 'm). 실내라면 창가 쪽으로 이동해보세요');
      state.myLoc = { lat: p.coords.latitude, lng: p.coords.longitude, acc: acc };
      resolve(state.myLoc);
    };
    const fail = () => { if (done) return; done = true; resolve(null); };
    const retry = () => navigator.geolocation.getCurrentPosition(ok, fail,
      { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
    // 1차: 빠른 측정. 정확도가 나쁘면(300m 초과) 한 번 더 정밀 측량
    navigator.geolocation.getCurrentPosition(p => {
      if ((p.coords.accuracy || 9999) <= 300) ok(p); else retry();
    }, retry, { enableHighAccuracy: true, timeout: timeoutMs || 8000, maximumAge: 0 });
  });
}

/* ================= 명령 파싱 ================= */
const MODE_KEYWORDS = [
  { kws: ['지하철로', '지하철'], mode: 'subway', label: '지하철' },
  { kws: ['버스로', '버스'], mode: 'bus', label: '버스' },
  { kws: ['대중교통으로', '대중교통'], mode: 'transit', label: '대중교통' },
  { kws: ['자전거로', '자전거'], mode: 'bike', label: '자전거' },
  { kws: ['자동차로', '차로', '운전'], mode: 'car', label: '자동차' },
  { kws: ['걸어서', '도보로', '도보'], mode: 'walk', label: '도보' },
];
const MODE_LABEL = { walk: '도보', car: '자동차', bike: '자전거', bus: '버스', subway: '지하철', transit: '대중교통' };

function parseCommand(text) {
  let t = (text || '').trim();
  if (!t) return null;
  if (/화장실/.test(t)) return { restroom: true, raw: text };
  let mode = 'walk', rest = t;
  for (const m of MODE_KEYWORDS) {
    for (const kw of m.kws) {
      if (rest.includes(kw)) { mode = m.mode; rest = rest.split(kw).join(' '); break; }
    }
  }
  rest = rest.replace(/으로\s*$/,'').replace(/로\s*$/,'').replace(/\s+/g,' ').trim();
  let from = null, to = null, m;
  if ((m = rest.match(/(.+?)에서\s+(.+?)까지/))) { from = m[1].trim(); to = m[2].trim(); }
  else if ((m = rest.match(/(.+?)까지/))) { to = m[1].trim(); }
  else if ((m = rest.match(/(.+?)(으로|로)$/))) { to = m[1].trim(); }
  else to = rest;
  to = (to || '').replace(/^(가|가줘|가기|가라)$/, '').trim();
  from = (from || '').trim() || null;
  return { from, to, mode, raw: text };
}

/* ================= 경로 탐색 (OSRM) ================= */
// 차: OSRM 공개 서버(자동차 전용). 도보/자전거: FOSSGIS OSRM foot/bike 전용 인스턴스
// (주의: router.project-osrm.org는 도보/자전거 요청에도 자동차 경로를 반환하므로 분리함)
const ROUTE_HOST = {
  car: 'https://router.project-osrm.org',
  walk: 'https://routing.openstreetmap.de/routed-foot',
  bike: 'https://routing.openstreetmap.de/routed-bike'
};
async function fetchRoute(from, to, mode) {
  // 도보: TMap 키가 있으면 TMap 보행자 API(한국 도보 데이터) 우선
  if (mode === 'walk') {
    const tkey = (localStorage.getItem('tmap_key') || '').trim();
    if (tkey) {
      try { return await fetchTmapWalk(from, to, tkey); }
      catch (e) {
        if (e && e.name === 'TypeError') toast('TMap 직접 호출이 차단됐어요. 공개 서버로 계산합니다.');
        /* 폴백: 아래 공개 서버 */
      }
    }
  }
  const host = ROUTE_HOST[mode] || ROUTE_HOST.walk;
  const url = host + '/route/v1/driving/' +
    from.lng + ',' + from.lat + ';' + to.lng + ',' + to.lat +
    '?overview=full&geometries=geojson&steps=true';
  const r = await fetch(url);
  const j = await r.json();
  if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error('no-route');
  const rt = j.routes[0];
  const points = rt.geometry.coordinates.map(c => [c[1], c[0]]);
  const steps = (rt.legs[0] && rt.legs[0].steps) || [];
  // 각 step의 maneuver 지점까지 누적 거리 계산
  let cum = 0;
  const targets = steps.map(s => { const t = { cumDist: cum, step: s }; cum += (s.distance || 0); return t; });
  return { points, distance: rt.distance, duration: rt.duration, steps, targets, total: cum };
}

/* ================= TMap 보행자 경로 ================= */
function tmapModifier(turnType) {
  const t = +turnType;
  if (t === 12 || t === 16 || t === 17) return 'left';
  if (t === 13 || t === 18 || t === 19) return 'right';
  if (t === 14) return 'uturn';
  return '';
}
async function fetchTmapWalk(from, to, key) {
  const r = await fetch('https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'appKey': key },
    body: JSON.stringify({
      startX: String(from.lng), startY: String(from.lat),
      endX: String(to.lng), endY: String(to.lat),
      startName: from.name || '출발지', endName: to.name || '목적지',
      reqCoordType: 'WGS84GEO', resCoordType: 'WGS84GEO', searchOption: '0'
    })
  });
  if (!r.ok) throw new Error('tmap-' + r.status);
  const j = await r.json();
  const feats = j.features || [];
  let distance = 0, duration = 0;
  const points = [], pts = [];
  for (const f of feats) {
    const p = f.properties || {}, g = f.geometry || {};
    if (p.totalDistance) distance = Math.max(distance, +p.totalDistance);
    if (p.totalTime) duration = Math.max(duration, +p.totalTime);
    if (g.type === 'LineString' && g.coordinates) {
      for (const c of g.coordinates) points.push([c[1], c[0]]);
    } else if (g.type === 'Point' && g.coordinates) {
      pts.push({ lat: g.coordinates[1], lng: g.coordinates[0], p });
    }
  }
  if (!points.length || !distance) throw new Error('tmap-empty');
  const steps = pts.map((pt, i) => {
    const last = i === pts.length - 1;
    const nxt = pts[i + 1];
    return {
      maneuver: { type: last ? 'arrive' : 'turn', modifier: last ? '' : tmapModifier(pt.p.turnType) },
      distance: nxt ? haversineM(pt, nxt) : 0,
      name: pt.p.intersectionName || pt.p.nearPoiName || '',
      tmapDesc: pt.p.description || (last ? '목적지에 도착합니다' : '')
    };
  });
  let cum = 0;
  const targets = steps.map(s => { const t = { cumDist: cum, step: s }; cum += (s.distance || 0); return t; });
  return { points, distance, duration, steps, targets, total: cum };
}

/* ================= 하단 시트 ================= */
function openSheet(html) { const s = $('sheet'); s.innerHTML = html; s.classList.add('open'); }
function closeSheet() { $('sheet').classList.remove('open'); }
function sheetLoading(msg) {
  openSheet('<div class="loading"><div class="spin"></div><div>' + msg + '</div></div>');
}

  openSheet('<div class="err">' + msg + '</div><div class="btnrow" style="margin-top:12px">' +
    '<button class="btn ghost" onclick="closeSheet()">닫기</button></div>');
}
function modeChips(current, onclickName) {

  return '<div class="chips">' + modes.map(m =>

/* ================= 메인 명령 처리 ================= */
let busy = false;
async function handleCommand(text) {
  if (busy) { toast('처리 중입니다. 잠시만요.'); return; }
  const parsed = parseCommand(text);
  if (!parsed || (!parsed.restroom && !parsed.to)) {
    sheetError('목적지를 알아듣지 못했어요.<br>예) "강남역까지 걸어서", "우리집에서 회사까지 버스로"');
    speak('목적지를 알아듣지 못했어요.');
    return;
  }
  busy = true;
  try {
    if (parsed.restroom) { await findRestrooms(); return; }
    sheetLoading('"' + parsed.to + '" 검색 중…');
    const near = state.myLoc || await getGPS(6000);

    // 출발지
    let from, fromSearched = false;
    const fromAlias = resolveAlias(parsed.from);
    if (fromAlias && typeof fromAlias === 'object') from = fromAlias;
    else if (typeof fromAlias === 'string') {
      from = await geocode(fromAlias, near);
      if (!from) throw new Error('from-fail:' + fromAlias);
      fromSearched = true;
    } else {
      from = near || await getGPS(8000);
      if (!from) throw new Error('no-gps');
      from = { lat: from.lat, lng: from.lng, name: '현재 위치' };
    }
    // 도착지
    const toAlias = resolveAlias(parsed.to);
    let to, toSearched = false;
    if (toAlias && typeof toAlias === 'object') to = toAlias;
    else { to = await geocode(toAlias, near); if (!to) throw new Error('to-fail:' + parsed.to); toSearched = true; }

    // 지하철역이면 가장 가까운 출구로 스냅 (도착지: 출발지 기준 / 출발지: 도착지 기준)
    if (fromSearched && isSubwayStation(from) && to) {
      const ex = await nearestExit(from, to);
      if (ex) from = { lat: ex.lat, lng: ex.lng, name: ex.name };
    }
    if (toSearched && isSubwayStation(to) && from) {
      const ex = await nearestExit(to, from);
      if (ex) { to = { lat: ex.lat, lng: ex.lng, name: ex.name }; toast('가장 가까운 출구인 ' + ex.name + '(으)로 안내합니다'); }
    }

    if (['bus', 'subway', 'transit'].includes(parsed.mode)) { showTransit(from, to, parsed.mode); return; }
    await showRoute(from, to, parsed.mode);
  } catch (e) {
    const msg = String(e.message || e);
    if (msg.startsWith('from-fail')) sheetError('출발지 "' + msg.slice(9) + '"를 찾지 못했어요.');
    else if (msg.startsWith('to-fail')) sheetError('목적지 "' + msg.slice(8) + '"를 찾지 못했어요.<br>주소를 정확히 말하거나 설정에서 저장 장소로 등록해 보세요.');
    else if (msg === 'no-gps') sheetError('현재 위치를 가져오지 못했어요.<br>위치 권한을 허용하고 다시 시도해 주세요.');
    else if (msg === 'no-route') sheetError('경로를 찾지 못했어요. 잠시 후 다시 시도해 주세요.');
    else sheetError('검색 중 오류가 발생했어요.');
    speak('검색하지 못했어요.');
  } finally { busy = false; }
}

async function showRoute(from, to, mode, opts) {
  opts = opts || {};
  if (!opts.quiet) sheetLoading('경로 계산 중…');
  const route = await fetchRoute(from, to, mode);
  state.lastRoute = { from, to, mode, points: route.points, distance: route.distance, duration: route.duration, steps: route.steps, targets: route.targets, total: route.total };
  state.adapter.clearMarkers();
  state.adapter.clearRoute();
  state.adapter.addMarker(from.lat, from.lng, { label: '출발: ' + from.name });
  state.adapter.addMarker(to.lat, to.lng, { label: '도착: ' + to.name });
  state.adapter.drawRoute(route.points);
  if (!opts.quiet) {
    openSheet(
      '<h3>' + from.name + ' → ' + to.name + '</h3>' +
      '<div class="meta"><span>거리 <b>' + fmtDist(route.distance) + '</b></span>' +
      '<span>예상 <b>' + fmtTime(route.duration) + '</b></span>' +
      '<span>' + MODE_LABEL[mode] + '</span></div>' +
      modeChips(mode) +
      '<div class="btnrow">' +
      '<button class="btn" id="navStart">길안내 시작</button>' +
      '<button class="btn ghost" onclick="closeSheet()">닫기</button>' +
      '</div>'
    );
    document.querySelectorAll('#sheet .chip').forEach(c => {
      c.onclick = () => { const m = c.dataset.mode; closeSheet(); rerouteWithMode(m); };
    });
    $('navStart').onclick = startNavigation;
    speak(from.name + '에서 ' + to.name + '까지 ' + MODE_LABEL[mode] + ' 경로입니다. 거리 ' + fmtDist(route.distance) + ', 예상 시간 ' + fmtTime(route.duration));
  }
  return route;
}
async function rerouteWithMode(mode) {
  const lr = state.lastRoute;
  if (!lr) return;
  if (['bus', 'subway', 'transit'].includes(mode)) { showTransit(lr.from, lr.to, mode); return; }
  try { await showRoute(lr.from, lr.to, mode); }
  catch (e) { sheetError('경로를 찾지 못했어요.'); }
}

function showTransit(from, to, mode) {
  state.adapter.clearMarkers(); state.adapter.clearRoute();
  state.adapter.addMarker(from.lat, from.lng, { label: '출발: ' + from.name });
  state.adapter.addMarker(to.lat, to.lng, { label: '도착: ' + to.name });
  openSheet(
    '<h3>' + from.name + ' → ' + to.name + '</h3>' +
    '<div class="meta"><span>' + MODE_LABEL[mode] + '</span></div>' +
    modeChips(mode) +
    '<div class="hint">대중교통 상세 경로는 지도 앱에서 확인해 주세요.</div>' +
    '<div class="btnrow" style="margin-top:10px">' +
    '<button class="btn blue" id="openKakao">카카오맵에서 보기</button>' +
    '<button class="btn ghost" id="openNaver">네이버지도에서 보기</button>' +
    '</div>'
  );
  document.querySelectorAll('#sheet .chip').forEach(c => {
    c.onclick = () => { const m = c.dataset.mode; closeSheet(); rerouteWithMode(m); };
  });
  $('openKakao').onclick = () => window.open('https://map.kakao.com/link/to/' + encodeURIComponent(to.name) + ',' + to.lat + ',' + to.lng, '_blank');
  $('openNaver').onclick = () => window.open('https://map.naver.com/v5/search/' + encodeURIComponent(to.name), '_blank');
  speak(MODE_LABEL[mode] + ' 경로는 지도 앱에서 확인해 주세요.');
}

/* ================= 근처 화장실 ================= */
async function findRestrooms() {
  sheetLoading('근처 화장실 검색 중…');
  const near = state.myLoc || await getGPS(8000);
  if (!near) { sheetError('현재 위치를 가져오지 못했어요.'); return; }
  let list = [];
  if (state.kakaoReady && state.adapter instanceof KakaoAdapter) {
    try { list = await state.adapter.searchKeywordList('화장실', near, 8); } catch (e) {}
  }
  if (!list.length) {
    const r = await nominatimSearch('화장실', near);
    if (r) list = [r];
  }
  state.adapter.clearMarkers(); state.adapter.clearRoute();
  state.adapter.setCenter(near.lat, near.lng);
  state.adapter.addMarker(near.lat, near.lng, { label: '현재 위치' });
  if (!list.length) { sheetError('근처 화장실을 찾지 못했어요.'); return; }
  list.forEach((p, i) => state.adapter.addMarker(p.lat, p.lng, { label: (i + 1) + '. ' + p.name }));
  openSheet('<h3>근처 화장실 ' + list.length + '곳</h3><div class="route-line">' +
    list.map((p, i) => '<div><b>' + (i + 1) + '.</b> ' + p.name + ' <span style="color:var(--muted)">(' + fmtDist(haversineM(near, p)) + ')</span></div>').join('') +
    '</div><div class="btnrow"><button class="btn ghost" onclick="closeSheet()">닫기</button></div>');
  speak('근처 화장실 ' + list.length + '곳을 찾았어요.');
}

/* ================= 길안내 모드 ================= */
const nav = {
  active: false, points: [], cum: [], total: 0, targets: [],
  stepIdx: 0, announced: {}, offCount: 0, watchId: null, dest: null, wakeLock: null,
};
function actionPhrase(step) {
  if (step && step.tmapDesc) return step.tmapDesc; // TMap 한국어 안내문구 우선
  const mn = (step && step.maneuver) || {};
  const mod = mn.modifier || '';
  if (mn.type === 'arrive') return '목적지에 도착합니다';
  const m = { 'left': '좌회전', 'right': '우회전', 'slight left': '좌회전', 'slight right': '우회전', 'sharp left': '좌회전', 'sharp right': '우회전', 'uturn': '유턴' };
  const road = step.name ? ' (' + step.name + ')' : '';
  return (m[mod] || '직진') + '입니다' + road;
}
function startNavigation() {
  const lr = state.lastRoute;
  if (!lr || !lr.points.length) { toast('먼저 경로를 검색해 주세요.'); return; }
  closeSheet();
  // 누적 거리
  nav.points = lr.points.map(p => ({ lat: p[0], lng: p[1] }));
  nav.cum = [0];
  for (let i = 1; i < nav.points.length; i++)
    nav.cum.push(nav.cum[i - 1] + haversineM(nav.points[i - 1], nav.points[i]));
  nav.total = nav.cum[nav.cum.length - 1];
  nav.targets = lr.targets; nav.stepIdx = 0; nav.announced = {}; nav.offCount = 0;
  nav.dest = lr.to; nav.active = true;
  $('guidance').classList.add('on');
  $('gDest').textContent = '목적지: ' + lr.to.name + ' · ' + MODE_LABEL[lr.mode];
  $('gTurn').textContent = '길안내를 시작합니다';
  $('gDist').textContent = 'GPS 수신 중…';
  speak('길안내를 시작합니다.');
  // 화면 꺼짐 방지
  try {
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { nav.wakeLock = l; }).catch(() => {});
  } catch (e) {}
  if (navigator.geolocation) {
    nav.watchId = navigator.geolocation.watchPosition(onNavPos, onNavErr, {
      enableHighAccuracy: true, maximumAge: 1000, timeout: 10000
    });
  } else { stopNavigation(); toast('GPS를 사용할 수 없습니다.'); }
}
function stopNavigation(silent) {
  nav.active = false;
  if (nav.watchId != null) { try { navigator.geolocation.clearWatch(nav.watchId); } catch (e) {} nav.watchId = null; }
  if (nav.wakeLock) { try { nav.wakeLock.release(); } catch (e) {} nav.wakeLock = null; }
  $('guidance').classList.remove('on');
  if (!silent) speak('길안내를 종료합니다.');
}
function onNavErr() { /* 일시적 GPS 오류는 무시 */ }
function onNavPos(pos) {
  if (!nav.active) return;
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  const acc = pos.coords.accuracy || 20;
  state.myLoc = { lat, lng };
  state.adapter.setUserLocation(lat, lng);
  updateHeadingFromGPS(lat, lng);

  // 경로상에 투영
  let best = null;
  for (let i = 0; i < nav.points.length - 1; i++) {
    const pr = projectPointOnSegment({ lat, lng }, nav.points[i], nav.points[i + 1]);
    if (!best || pr.dist < best.dist) best = { d: nav.cum[i] + pr.along, dist: pr.dist };
  }
  if (!best) return; // 투영 실패 → 직선거리로 안내하지 않고 대기
  const tol = 40 + acc / 2;
  if (best.dist > tol) {
    nav.offCount++;
    if (nav.offCount >= 3) rerouteFromHere(lat, lng);
    else { $('gDist').textContent = '경로 재확인 중…'; }
    return;
  }
  nav.offCount = 0;
  const d = best.d;

  // 도착 판정
  if (d >= nav.total - 25) {
    $('gTurn').textContent = '목적지에 도착했습니다';
    $('gDist').textContent = '';
    speak('목적지에 도착했습니다. 길안내를 종료합니다.');
    stopNavigation(true);
    return;
  }
  // 다음 maneuver 찾기
  while (nav.stepIdx < nav.targets.length && nav.targets[nav.stepIdx].cumDist < d + 8) {
    // 이미 지난 지점인데 안내하지 않은 경우 스킵 (조기/누락 방지)
    nav.stepIdx++;
  }
  if (nav.stepIdx >= nav.targets.length) return;
  const tgt = nav.targets[nav.stepIdx];
  const remain = tgt.cumDist - d;
  const phrase = actionPhrase(tgt.step);
  const key = nav.stepIdx;
  if (remain <= 320 && remain > 130 && !nav.announced[key + '_300']) {
    nav.announced[key + '_300'] = 1;
    speak(Math.round(remain / 10) * 10 + 'm 앞에서 ' + phrase);
  } else if (remain <= 130 && remain > 35 && !nav.announced[key + '_100']) {
    nav.announced[key + '_100'] = 1;
    speak(Math.round(remain / 10) * 10 + 'm 앞에서 ' + phrase);
  } else if (remain <= 35 && !nav.announced[key + '_now']) {
    nav.announced[key + '_now'] = 1;
    speak('곧 ' + phrase);
  }
  $('gDist').textContent = fmtDist(Math.max(0, remain)) + ' 남음';
  $('gTurn').textContent = phrase;
}
let rerouting = false;
async function rerouteFromHere(lat, lng) {
  if (rerouting || !nav.active) return;
  rerouting = true;
  $('gDist').textContent = '경로 재탐색 중…';
  try {
    const lr = state.lastRoute;
    const from = { lat, lng, name: '현재 위치' };
    const route = await fetchRoute(from, lr.to, lr.mode);
    state.lastRoute = { from, to: lr.to, mode: lr.mode, points: route.points, distance: route.distance, duration: route.duration, steps: route.steps, targets: route.targets, total: route.total };
    state.adapter.clearRoute();
    state.adapter.drawRoute(route.points);
    // nav 상태 리셋
    nav.points = route.points.map(p => ({ lat: p[0], lng: p[1] }));
    nav.cum = [0];
    for (let i = 1; i < nav.points.length; i++) nav.cum.push(nav.cum[i - 1] + haversineM(nav.points[i - 1], nav.points[i]));
    nav.total = nav.cum[nav.cum.length - 1];
    nav.targets = route.targets; nav.stepIdx = 0; nav.announced = {}; nav.offCount = 0;
    speak('경로를 다시 찾았습니다.');
  } catch (e) { $('gDist').textContent = '재탐색 실패'; }
  rerouting = false;
}

/* ================= 나침반 ================= */
let headingDeg = null, compassMode = 'north'; // 'north' | 'heading'
let lastGpsForHeading = null;
function updateCompass() {
  if (headingDeg == null) return;
  const deg = Math.round(headingDeg);
  $('cdeg').textContent = deg + '°';
  const show = compassMode === 'heading' ? 0 : -headingDeg;
  $('cdial').style.transform = 'rotate(' + show + 'deg)';
  $('cmode').textContent = compassMode === 'heading' ? '진행 방향' : '북쪽 고정';
}
async function onCompassTap() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch (e) {}
  compassMode = compassMode === 'north' ? 'heading' : 'north';
  updateCompass();
  toast(compassMode === 'heading' ? '진행 방향이 위로 표시됩니다' : '북쪽 고정으로 표시됩니다');
}
window.addEventListener('deviceorientation', e => {
  let h = null;
  if (e.webkitCompassHeading != null && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
  else if (e.alpha != null && !isNaN(e.alpha)) h = (360 - e.alpha) % 360;
  if (h != null) { headingDeg = h; updateCompass(); }
});
function updateHeadingFromGPS(lat, lng) {
  const now = Date.now();
  if (lastGpsForHeading && now - lastGpsForHeading.t < 8000) {
    const d = haversineM(lastGpsForHeading, { lat, lng });
    const dt = (now - lastGpsForHeading.t) / 1000;
    if (d > 3 && dt > 0 && d / dt > 1.2 && headingDeg == null) {
      const r = Math.PI / 180;
      const y = Math.sin((lng - lastGpsForHeading.lng) * r) * Math.cos(lat * r);
      const x = Math.cos(lastGpsForHeading.lat * r) * Math.sin(lat * r) -
        Math.sin(lastGpsForHeading.lat * r) * Math.cos(lat * r) * Math.cos((lng - lastGpsForHeading.lng) * r);
      headingDeg = (Math.atan2(y, x) / r + 360) % 360;
      updateCompass();
    }
  }
  lastGpsForHeading = { lat, lng, t: now };
}

/* ================= 음성 입력 ================= */
let recog = null, listening = false;
function toggleMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('이 브라우저는 음성 인식을 지원하지 않습니다.'); return; }
  if (listening && recog) { try { recog.stop(); } catch (e) {} return; }
  recog = new SR();
  recog.lang = 'ko-KR'; recog.interimResults = false; recog.maxAlternatives = 1;
  recog.onstart = () => { listening = true; $('micBtn').classList.add('listening'); };
  recog.onend = () => { listening = false; $('micBtn').classList.remove('listening'); };
  recog.onerror = () => { listening = false; $('micBtn').classList.remove('listening'); };
  recog.onresult = e => {
    const text = e.results[0][0].transcript;
    $('cmdInput').value = text;
    handleCommand(text);
  };
  try { recog.start(); } catch (e) {}
}

/* ================= 설정 UI ================= */
function renderPlaces() {
  const box = $('placeList');
  const names = Object.keys(state.savedPlaces);
  box.innerHTML = names.length
    ? names.map(n => '<div class="place-row"><span>📍 ' + n + '</span>' +
      '<button class="del" data-n="' + n + '">삭제</button></div>').join('')
    : '<div class="hint">등록된 장소가 없습니다.</div>';
  box.querySelectorAll('.del').forEach(b => {
    b.onclick = () => { delete state.savedPlaces[b.dataset.n]; saveSavedPlaces(); renderPlaces(); };
  });
}
async function addPlace() {
  const name = $('placeName').value.trim(), addr = $('placeAddr').value.trim();
  if (!name || !addr) { toast('이름과 주소를 입력해 주세요.'); return; }
  toast('주소 검색 중…');
  const g = await geocode(addr, state.myLoc);
  if (!g) { toast('주소를 찾지 못했어요.'); return; }
  state.savedPlaces[name] = { lat: g.lat, lng: g.lng, name };
  saveSavedPlaces(); renderPlaces();
  $('placeName').value = ''; $('placeAddr').value = '';
  toast('"' + name + '" 저장됨');
}
function openSettings() { renderPlaces(); $('settingsModal').classList.add('open'); }
function closeSettings() { $('settingsModal').classList.remove('open'); }

/* ================= 초기화 ================= */
async function initMap() {
  // 1) 카카오 SDK 시도
  try {
    await loadScript(KAKAO_SDK_URL, 10000);
    const ka = new KakaoAdapter();
    await ka.init();
    state.adapter = ka; state.kakaoReady = true;
    $('kakaoStat').textContent = '사용 중';
    return;
  } catch (e) { /* 폴백 */ }
  // 2) Leaflet + OSM 폴백
  try {
    const la = new LeafletAdapter();
    await la.init();
    state.adapter = la; state.kakaoReady = false;
    $('kakaoStat').textContent = '도메인 미등록 (OSM 표시 중)';
    toast('카카오 지도 인증 실패 — OSM 지도로 표시됩니다. Vercel 도메인을 카카오 콘솔에 등록하면 카카오 지도가 표시됩니다.', 4500);
  } catch (e2) {
    toast('지도를 불러오지 못했습니다. 네트워크를 확인해 주세요.');
  }
}

async function init() {
  loadSavedPlaces();
  $('micBtn').onclick = toggleMic;
  $('searchBtn').onclick = () => { const t = $('cmdInput').value.trim(); if (t) handleCommand(t); };
  $('cmdInput').addEventListener('keydown', e => { if (e.key === 'Enter') { const t = e.target.value.trim(); if (t) handleCommand(t); } });
  $('compass').onclick = onCompassTap;
  $('locBtn').onclick = async () => {
    const p = await getGPS(8000);
    if (p) { state.adapter.setCenter(p.lat, p.lng); state.adapter.setUserLocation(p.lat, p.lng); }
    else toast('위치를 가져오지 못했어요. 권한을 확인해 주세요.');
  };
  $('setBtn').onclick = openSettings;
  $('setClose').onclick = closeSettings;
  $('settingsModal').addEventListener('click', e => { if (e.target.id === 'settingsModal') closeSettings(); });
  $('placeAdd').onclick = addPlace;
  $('tmapKey').value = localStorage.getItem('tmap_key') || '';
  $('tmapSave').onclick = async () => {
    const v = $('tmapKey').value.trim();
    if (!v) { localStorage.removeItem('tmap_key'); toast('TMap 키 삭제됨.'); return; }
    localStorage.setItem('tmap_key', v);
    toast('연결 테스트 중…');
    try {
      // 서울시청→광화문 짧은 구간으로 키 유효성 테스트
      await fetchTmapWalk({ lat: 37.5663, lng: 126.9779, name: '테스트' }, { lat: 37.5759, lng: 126.9769, name: '테스트' }, v);
      toast('TMap 연결 성공! 도보 경로는 TMap으로 계산됩니다.');
    } catch (e) {
      toast('TMap 연결 실패(' + (e.message || '오류') + '). 키와 상품 구독을 확인해 주세요.');
    }
  };
  $('gStop').onclick = () => stopNavigation();
  $('provKakao').onclick = () => toast('카카오 지도를 사용 중입니다.');
  $('provNaver').onclick = () => toast('네이버 지도는 준비 중입니다.');

  await initMap();
  if (!state.adapter) return;
  const p = await getGPS(6000);
  if (p) { state.adapter.setCenter(p.lat, p.lng); state.adapter.setUserLocation(p.lat, p.lng); }
  updateCompass();
}
document.addEventListener('DOMContentLoaded', init);
</script>
